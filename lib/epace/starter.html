<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CognitiveConnect service</title>
<style>
*{box-sizing:border-box}body{font:15px/1.7 system-ui,-apple-system,sans-serif;background:#f5f6fb;color:#142b49;max-width:1000px;margin:42px auto;padding:24px}h1{font-size:30px;letter-spacing:-1px;line-height:1.2}.intro{color:#71819b;margin-bottom:30px}section{background:white;border:1px solid #e1e6f0;border-radius:20px;padding:28px;margin:20px 0;box-shadow:0 6px 24px #142b4904}input,textarea,button{font:inherit;padding:11px 14px;border:1px solid #e1e6f0;border-radius:10px}input[type=password]{width:min(100%,380px)}input[type=file]{max-width:100%;background:#fafbfe}textarea{width:100%;min-height:108px;resize:vertical;color:#142b49}button{background:#6351e9;color:white;cursor:pointer;font-weight:600}button:disabled{opacity:.55;cursor:default}label{display:block;margin:12px 0 8px;font-weight:500}label input{display:block;margin-top:8px}button:focus-visible,input:focus-visible,textarea:focus-visible,a:focus-visible,summary:focus-visible{outline:3px solid #b9afff;outline-offset:3px}.status{color:#71819b;font-size:13px}.result{margin-top:24px;border-top:1px solid #e1e6f0;padding-top:24px}.answer-header{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:20px}.ai-label{display:inline-flex;align-items:center;gap:10px;color:#6351e9;font-size:12px;font-weight:700;letter-spacing:.07em}.star{width:23px;height:23px}.loading .star{animation:turn 2s ease-in-out infinite}.copy{background:#f7f5ff;border-color:#e8e3ff;color:#6351e9;font-size:12px;padding:7px 11px}.answer{font-size:15px;line-height:1.8;overflow-wrap:anywhere}.answer>:first-child{margin-top:0}.answer>:last-child{margin-bottom:0}.answer h1,.answer h2,.answer h3,.answer h4{color:#142b49;letter-spacing:-.025em;line-height:1.4;margin:26px 0 12px}.answer h1{font-size:24px}.answer h2{font-size:21px}.answer h3{font-size:18px}.answer p{margin:12px 0}.answer ul,.answer ol{padding-left:26px;margin:14px 0}.answer li{padding-left:4px;margin:8px 0}.answer li>p{margin:5px 0}.answer strong{font-weight:650;color:#142b49}.answer a{color:#6351e9;text-underline-offset:3px}.answer code{font:13px/1.65 ui-monospace,SFMono-Regular,Consolas,monospace;background:#f1eefc;color:#5140b7;padding:2px 5px;border-radius:5px}.answer pre{background:#f7f8fc;border:1px solid #e1e6f0;border-radius:12px;padding:17px;overflow-x:auto;white-space:pre;margin:18px 0}.answer pre code{background:none;color:#142b49;padding:0}.answer blockquote{border-left:3px solid #a899fa;margin:18px 0;padding:1px 18px;background:#faf9ff;color:#526581}.answer hr{border:0;border-top:1px solid #e1e6f0;margin:24px 0}.table-scroll{overflow-x:auto;margin:18px 0;border:1px solid #e1e6f0;border-radius:12px}.answer table{border-collapse:collapse;width:100%;font-size:14px}.answer th,.answer td{padding:11px 15px;text-align:left;border-bottom:1px solid #e1e6f0}.answer th{background:#f5f3ff;font-weight:650}.answer tr:last-child td{border-bottom:0}.citation{display:inline-block;background:#f0edff;border-radius:5px;padding:0 5px;font-size:12px;text-decoration:none}.sources{margin-top:26px;border-top:1px solid #e1e6f0;padding-top:18px}.sources h3{font-size:12px;letter-spacing:.08em;color:#71819b;text-transform:uppercase}.sources details{border:1px solid #e1e6f0;border-radius:12px;padding:12px 16px;margin:10px 0}.sources summary{cursor:pointer;font-size:14px;font-weight:550}.source-text{white-space:pre-wrap;overflow-wrap:anywhere;font:13px/1.8 system-ui;color:#526581;max-height:300px;overflow:auto;margin-top:14px}.metadata{font-size:12px;color:#71819b;margin-top:20px}[hidden]{display:none!important}@keyframes turn{0%,100%{transform:rotate(0);opacity:1}50%{transform:rotate(35deg);opacity:.45}}@media(prefers-reduced-motion:reduce){.loading .star{animation:none}}@media(max-width:600px){body{margin:10px auto;padding:14px}section{padding:20px}h1{font-size:25px}}
</style></head><body>
<h1>ePACE / CognitiveConnect</h1><p class="intro">Knowledge-grounded answers from your configured model.</p>
<section><label>Service token <input type="password" id="token" autocomplete="off"></label><label>Knowledge document (TXT, Markdown, CSV, JSON) <input type="file" id="file" accept=".txt,.md,.csv,.json"></label><button id="upload">Upload knowledge</button><p id="uploadStatus" class="status" role="status"></p></section>
<section><label for="question">Question</label><textarea id="question" maxlength="12000" placeholder="Ask a question about your uploaded documents…"></textarea><p><button id="ask">Ask question</button></p>
<div id="result" class="result" hidden><div class="answer-header"><span class="ai-label"><svg class="star" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="m12 3 2.4 6.6L21 12l-6.6 2.4L12 21l-2.4-6.6L3 12l6.6-2.4L12 3Z"/><path d="m20 1 .8 2.2L23 4l-2.2.8L20 7l-.8-2.2L17 4l2.2-.8L20 1Z"/></svg>AI OUTPUT</span><button id="copy" class="copy" hidden>Copy Markdown</button></div><div id="answer" class="answer" aria-live="polite" aria-busy="false"></div><div id="metadata" class="metadata"></div><div id="sources" class="sources" hidden></div></div></section>
<script src="/assets/marked.js"></script><script src="/assets/purify.js"></script><script>
const el=id=>document.getElementById(id);let answerMarkdown='';
function renderMarkdown(markdown,container){container.innerHTML=DOMPurify.sanitize(marked.parse(String(markdown),{gfm:true,breaks:false}),{USE_PROFILES:{html:true},FORBID_TAGS:['style','form','input','button','img','video','audio'],FORBID_ATTR:['style']});for(const link of container.querySelectorAll('a')){const href=link.getAttribute('href')||'';if(!/^(https?:|mailto:|#)/i.test(href)){link.removeAttribute('href');continue;}if(/^https?:/i.test(href)){link.target='_blank';link.rel='noopener noreferrer';}}for(const table of container.querySelectorAll('table')){const wrapper=document.createElement('div');wrapper.className='table-scroll';table.replaceWith(wrapper);wrapper.append(table);}}
function addCitations(container,count){const walker=document.createTreeWalker(container,NodeFilter.SHOW_TEXT),nodes=[];while(walker.nextNode())if(!walker.currentNode.parentElement.closest('pre,code,a'))nodes.push(walker.currentNode);for(const node of nodes){const text=node.textContent,re=/\[(\d+)\]/g;let match,last=0,changed=false;const fragment=document.createDocumentFragment();while((match=re.exec(text))){const number=Number(match[1]);if(number<1||number>count)continue;fragment.append(document.createTextNode(text.slice(last,match.index)));const link=document.createElement('a');link.className='citation';link.href='#source-'+number;link.textContent=match[0];link.setAttribute('aria-label','View source '+number);link.onclick=()=>{el('source-'+number).open=true;};fragment.append(link);last=re.lastIndex;changed=true;}if(changed){fragment.append(document.createTextNode(text.slice(last)));node.replaceWith(fragment);}}}
const request=async(path,data)=>{const res=await fetch(path,{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+el('token').value},body:JSON.stringify(data)});const result=await res.json();if(!res.ok)throw new Error(result.error);return result;};
el('upload').onclick=async()=>{const button=el('upload');button.disabled=true;try{const file=el('file').files[0];if(!file)throw new Error('Choose a document.');const result=await request('/api/documents',{name:file.name,content:await file.text()});el('uploadStatus').textContent='Saved '+result.passages+' passages.';}catch(e){el('uploadStatus').textContent=e.message;}finally{button.disabled=false;}};
el('copy').onclick=async()=>{try{await navigator.clipboard.writeText(answerMarkdown);el('copy').textContent='Copied';setTimeout(()=>el('copy').textContent='Copy Markdown',1500);}catch{el('copy').textContent='Copy unavailable';}};
el('ask').onclick=async()=>{if(!el('question').value.trim()){el('question').focus();return;}const button=el('ask');button.disabled=true;answerMarkdown='';el('result').hidden=false;el('result').classList.add('loading');el('answer').setAttribute('aria-busy','true');el('answer').textContent='Retrieving evidence and checking safety…';el('metadata').textContent='';el('copy').hidden=true;el('sources').replaceChildren();el('sources').hidden=true;try{const result=await request('/api/chat',{question:el('question').value});answerMarkdown=String(result.answer||'');renderMarkdown(answerMarkdown,el('answer'));el('copy').hidden=!answerMarkdown;const sources=result.sources||[];if(sources.length){el('sources').hidden=false;const heading=document.createElement('h3');heading.textContent='Supporting sources';el('sources').append(heading);}for(const [i,s]of sources.entries()){const details=document.createElement('details'),title=document.createElement('summary'),text=document.createElement('div');details.id='source-'+(i+1);title.textContent='['+(i+1)+'] '+s.name;text.className='source-text';text.textContent=s.text;details.append(title,text);el('sources').append(details);}addCitations(el('answer'),sources.length);const meta=[];if(result.blocked)meta.push('Blocked by safety policy');if(result.usage&&Number.isFinite(result.usage.total_tokens))meta.push(result.usage.total_tokens.toLocaleString()+' tokens');if(Number.isFinite(result.latencyMs))meta.push((result.latencyMs/1000).toFixed(1)+' seconds');el('metadata').textContent=meta.join(' · ');}catch(e){el('answer').textContent=e.message;}finally{button.disabled=false;el('result').classList.remove('loading');el('answer').setAttribute('aria-busy','false');}};
</script></body></html>

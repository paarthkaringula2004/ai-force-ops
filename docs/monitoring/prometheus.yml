global:
  scrape_interval: 30s
  evaluation_interval: 30s
alerting:
  alertmanagers:
    - scheme: https
      static_configs:
        - targets: [eassist-alertmanager.onrender.com]
rule_files:
  - /etc/prometheus/alerts.yml
scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: [localhost:9090]
  - job_name: alertmanager
    scheme: https
    static_configs:
      - targets: [eassist-alertmanager.onrender.com]
  - job_name: eassist
    scheme: https
    metrics_path: /api/metrics
    static_configs:
      - targets: [ai-force-ops.onrender.com]
